
name: Midnight Files OAuth Diagnostic

on:
  workflow_dispatch:

jobs:
  test-youtube-oauth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test YouTube OAuth
        run: |
          python - <<'PY'
          import os
          import requests

          data = {
              "client_id": os.environ["YOUTUBE_CLIENT_ID"].strip(),
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"].strip(),
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"].strip(),
              "grant_type": "refresh_token"
          }

          response = requests.post(
              "https://oauth2.googleapis.com/token",
              data=data,
              timeout=30
          )

          print("HTTP status:", response.status_code)

          try:
              result = response.json()
          except ValueError:
              print("Google returned a non-JSON response.")
              raise SystemExit(1)

          print("Google error:", result.get("error", "None"))
          print("Error description:", result.get("error_description", "None"))
          print("Access token received:", bool(result.get("access_token")))

          if response.status_code != 200:
              raise SystemExit(1)

          print("SUCCESS: GitHub OAuth refresh test passed.")
          PY
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
