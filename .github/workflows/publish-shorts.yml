
name: GTA 5 Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
- cron: "30 9 * * *"
- cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: gta5-shorts-upload
  cancel-in-progress: false

jobs:
  upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests google-auth google-api-python-client

      - name: Upload one GTA 5 Short
        env:
          MIDNIGHT_WORKER_URL: ${{ secrets.MIDNIGHT_WORKER_URL }}
          MIDNIGHT_SCHEDULER_SECRET: ${{ secrets.MIDNIGHT_SCHEDULER_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_ID: "1s-AiCiDAd8yjj3OlMKAQO_vQfFfWIcnR"
          YOUTUBE_PRIVACY_STATUS: "public"
        run: python bot.py

      - name: Save upload history
        if: success()
        run: |
          if [ -f uploaded.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uploaded.json
            if ! git diff --cached --quiet; then
              git commit -m "Save GTA 5 Shorts upload history"
              git push
            else
              echo "No upload history changes to save."
            fi
          else
            echo "No uploaded.json was created; nothing to save."
          fi
