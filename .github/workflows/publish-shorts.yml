
name: Midnight Files Scheduled Shorts

on:
  schedule:
    - cron: "30 3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://generativelanguage.googleapis.com/v1beta/models"

          response = requests.get(
              url,
              params={"key": os.environ["GEMINI_API_KEY"]},
              timeout=30
          )

          print("Gemini API status:", response.status_code)

          if not response.ok:
              print("API error:", response.text[:1000])
              raise SystemExit(1)

          models = response.json().get("models", [])

          print("\nModels supporting generateContent:\n")

          found = False

          for model in models:
              if "generateContent" in model.get(
                  "supportedGenerationMethods", []
              ):
                  print(model.get("name"))
                  found = True

          if not found:
              print("No compatible models found.")
          PY

      - name: Get YouTube credentials
        env:
          WORKER_URL: ${{ secrets.MIDNIGHT_WORKER_URL }}
          SCHEDULER_SECRET: ${{ secrets.MIDNIGHT_SCHEDULER_SECRET }}
        run: |
          CONFIG=$(curl -fsS \
            -H "Authorization: Bearer $SCHEDULER_SECRET" \
            "${WORKER_URL%/}/internal/config")

          echo "YOUTUBE_REFRESH_TOKEN=$(echo "$CONFIG" | jq -r '.youtube_refresh_token')" >> "$GITHUB_ENV"
          echo "YOUTUBE_CLIENT_ID=$(echo "$CONFIG" | jq -r '.youtube_client_id')" >> "$GITHUB_ENV"
          echo "YOUTUBE_CLIENT_SECRET=$(echo "$CONFIG" | jq -r '.youtube_client_secret')" >> "$GITHUB_ENV"

      - name: Generate and publish Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python bot.py
